[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-schema-validator"
version = "0.1.0"
description = "Clean Python 3.12+ data validation and serialization framework leveraging PEP 695 type parameter syntax."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Developer" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/typed_schema_validator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

